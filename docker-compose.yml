version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080
    container_name: wealthra-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - wealthra-network

networks:
  wealthra-network:
    driver: bridge
